<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Student Portal</h1>
      <p>Welcome to the Student Portal!</p>
    </header>

    <nav>
      <a href="#home">Home</a>
      <a href="#register">Register</a>
      <a href="#media">Media</a>
    </nav>

    <main>
      <section id="home">
        <h2>Home</h2>
        <p>This is the home section of the student portal.</p>
        <img
          src="https://www.collegebatch.com/static/clg-gallery/lpu-jalandhar-360559.webp"
          alt="Hero Frame Image"
        />
      </section>

      <section id="register">
        <h2>Registration Form</h2>
        <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" minlength="3" required /><br /><br />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required /><br /><br />

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" minlength="8" required /><br /><br />

          <label for="dob">Date of Birth:</label>
          <input type="date" id="dob" name="dob" required /><br /><br />

          <label for="phone">Phone:</label>
          <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required /><br /><br />

          <fieldset>
            <legend>Gender:</legend>
            <input type="radio" id="male" name="gender" value="male" required />
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female" required />
            <label for="female">Female</label>
          </fieldset>
          <br /><br />

          <label for="course">Course:</label>
          <select id="course" name="course" required>
            <option value="">Select a course</option>
            <option value="computer-science">Computer Science</option>
            <option value="mathematics">Mathematics</option>
            <option value="physics">Physics</option>
          </select><br /><br />

          <label for="address">Address:</label>
          <textarea id="address" name="address" rows="4" cols="50" required></textarea><br /><br />

          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the terms and conditions</label><br /><br />

          <button type="submit">Register</button>
          <button type="reset">Reset</button>
        </form>
      </section>

      <section id="media">
        <h2>Multimedia</h2>
        <h3>Video</h3>

        <div class="video-wrapper">
          <iframe
            src="https://www.youtube.com/embed/GPRVlA6jIHI?si=WSFZCX7YboN9FO4H"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Student Portal. All rights reserved.</p>
    </footer>
  </body>
</html>
